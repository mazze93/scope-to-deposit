<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review your sprint scope</title>
<link rel="stylesheet" href="/workflow.css">
<main class="buyer-layout">
<header class="masthead">
<div><p class="eyebrow">Buyer review · Sandbox demo</p><h1>Review your sprint scope</h1><p class="subtitle">GitHub Repository Hardening Sprint · $1,250 engagement</p></div>
<p class="price"><strong>$625</strong><span>Deposit after acceptance</span></p>
</header>
<section class="panel" id="scope" aria-labelledby="buyer-heading" hidden>
<h2 id="buyer-heading">Scope for approval</h2>
<dl class="buyer-facts">
<div><dt>Repository</dt><dd id="repository"></dd></div>
<div><dt>Scope approver</dt><dd id="approver"></dd></div>
<div><dt>CI baseline</dt><dd id="ci-baseline"></dd></div>
</dl>
<h3>Proposed work</h3>
<ul id="work"></ul>
<p class="scope-block">Scope version <code id="version"></code></p>
<button id="accept" type="button">Accept this version</button>
</section>
<p id="status" role="status" aria-live="polite">Loading the reviewed scope…</p>
</main>
<script>
const token = location.hash.slice(1);
const status = document.getElementById('status');
const button = document.getElementById('accept');
let version;
async function update(accept = false) {
  button.disabled = true;
  if (accept) status.textContent = 'Recording acceptance…';
  try {
    const response = await fetch('/buyer/scope', {
      method: accept ? 'POST' : 'GET',
      headers: {'X-Demo-Buyer': token, 'Content-Type': 'application/json'},
      body: accept ? JSON.stringify({version}) : undefined,
    });
    const data = await response.json();
    if (!response.ok) throw Error(data.error);
    version = data.version;
    document.getElementById('version').textContent = version;
    document.getElementById('repository').textContent = data.review.repository;
    document.getElementById('approver').textContent = data.review.approver;
    document.getElementById('ci-baseline').textContent = data.review.ciBaseline;
    document.getElementById('work').replaceChildren(...data.work.map(task => {
      const item = document.createElement('li');
      item.textContent = task;
      return item;
    }));
    document.getElementById('scope').hidden = false;
    button.hidden = data.accepted;
    status.toggleAttribute('data-accepted', data.accepted);
    status.textContent = data.accepted ? 'This scope version is accepted.' : '';
  } catch (error) { status.textContent = error.message; }
  finally { button.disabled = false; }
}
button.addEventListener('click', () => update(true));
update();
</script>
</html>
